name: Release
# release-please maintains a release PR from conventional commits; merging it
# tags the release, and the publish job ships to npm via OIDC trusted
# publishing (no token, no OTP — configure the trusted publisher on npmjs.com
# to point at this workflow file).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # No registry-url on purpose: trusted publishing authenticates via
      # OIDC, and setup-node's token-templated .npmrc would only add an
      # empty-auth ambiguity.
      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache-dependency-path: package-lock.json
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and build
        run: |
          npm ci
          npm run build:clean

      - name: Gate on tests
        run: |
          npm run test
          npm run typecheck
          npm run lint

      - name: Publish to npm
        run: npm publish
