name: Release
# release-please maintains a release PR from conventional commits; merging it
# tags the release, and the publish job ships to npm via OIDC trusted
# publishing (no token, no OTP — configure the trusted publisher on npmjs.com
# to point at this workflow file).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description:
          Existing release tag to retry publishing (for example v0.2.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # release-please writes with the GitHub App token below, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # GitHub holds the checks of a pull request that github-actions[bot]
      # opens until a maintainer approves them. A release PR opened with a
      # GitHub App token runs its checks at once. The App needs contents,
      # pull requests and issues (labels) write on this repository.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          release-type: node
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if:
      ${{ always() && (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    env:
      RELEASE_TAG:
        ${{ github.event_name == 'workflow_dispatch' && inputs.tag ||
        needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Later steps run dependency code; keep the token out of .git/config.
          persist-credentials: false

      - name: Verify immutable release version
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`)'

      # No registry-url on purpose: trusted publishing authenticates via
      # OIDC, and setup-node's token-templated .npmrc would only add an
      # empty-auth ambiguity.
      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install and build
        run: |
          npm ci
          npm run build:clean
          npm run verify:package

      - name: Gate on tests
        run: |
          npm run test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: Publish to npm
        run: npm publish
